<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>플레이스 체크 현황</title>
<link rel="stylesheet" href="/shared.css">
<style>body{padding:20px;max-width:720px;margin:0 auto;font-family:system-ui,sans-serif}h1{font-size:20px;margin:0 0 6px}table{border-collapse:collapse;width:100%;margin-top:8px}td,th{border-bottom:1px solid #e5e5e5;padding:6px 4px;text-align:left;font-size:14px}th{color:#666;font-weight:500}.big{font-size:34px;font-weight:700;margin:6px 0}.muted{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.box{border:1px solid #e5e5e5;border-radius:8px;padding:10px}</style></head>
<body>
<h1>플레이스 체크 현황</h1>
<p class="muted" id="when"></p>
<div id="out"><p class="muted">불러오는 중…</p></div>
<script>
(async () => {
  const token = new URLSearchParams(location.search).get('token') || '';
  const out = document.getElementById('out');
  try {
    const r = await fetch('/api/stats/coupons?token=' + encodeURIComponent(token));
    if (r.status === 404) { out.innerHTML = '<p>주소의 token이 틀렸거나 빠졌어요.</p>'; return; }
    const d = await r.json();
    document.getElementById('when').textContent = new Date().toLocaleString('ko-KR') + ' 기준 · 새로 분석된 매장 수(24시간 내 재조회는 제외)';
    const cats = Object.entries(d.byCategory || {}).sort((a, b) => b[1].stores - a[1].stores);
    const kinds = Object.entries(d.byKind || {}).sort((a, b) => b[1] - a[1]);
    const dayRows = Object.entries(d.days || {}).sort((a, b) => b[0].localeCompare(a[0]));
    const seenP = new Set(); const recent = (d.recent || []).filter((r) => { if (seenP.has(r.placeId)) return false; seenP.add(r.placeId); return true; });
    const hhmm = (ts) => { const t = new Date(ts); return `${String(t.getMonth() + 1)}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`; };
    const llm = d.llm || { total: { calls: 0, in: 0, out: 0, cost: 0 }, byDay: {}, byKind: {} };
    const usd = (x) => '$' + (x || 0).toFixed(2);
    const krw = (x) => Math.round((x || 0) * 1400).toLocaleString('ko-KR') + '원';
    const llmDays = Object.entries(llm.byDay).sort((a, b) => b[0].localeCompare(a[0]));
    const kindKo = { reviews: '리뷰 장점·보완', keywords: '대표키워드', description: '상세설명' };
    const freshTotal = Object.values(d.days || {}).reduce((s, v) => s + (v.fresh || 0), 0);
    out.innerHTML = `<h3 style="margin-top:0">API 비용 (Claude)</h3><div class="grid"><div class="box"><div class="muted">누적(기록 시작 후)</div><div class="big">${usd(llm.total.cost)}</div><div class="muted">≈ ${krw(llm.total.cost)}</div></div><div class="box"><div class="muted">AI 호출</div><div class="big">${llm.total.calls}</div><div class="muted">매장당 3회</div></div><div class="box"><div class="muted">매장당 평균</div><div class="big">${llm.total.calls ? usd(llm.total.cost / (llm.total.calls / 3)) : '-'}</div><div class="muted">${llm.total.calls ? krw(llm.total.cost / (llm.total.calls / 3)) : ''}</div></div></div>`
      + `<p class="muted">기록 시작: ${llm.since ? new Date(llm.since).toLocaleString('ko-KR') : '아직 없음'} · 그 전 분석분(${freshTotal}매장 중 기록 전)은 콘솔 결제 페이지 참고 · 환율 1,400원 가정 · 검색광고 API·네이버 조회는 무료</p>`
      + `<table><tr><th>날짜</th><th>호출</th><th>입력 토큰</th><th>출력 토큰</th><th>비용</th></tr>${llmDays.map(([day, v]) => `<tr><td>${day}</td><td>${v.calls}</td><td>${v.in.toLocaleString()}</td><td>${v.out.toLocaleString()}</td><td>${usd(v.cost)}</td></tr>`).join('')}</table>`
      + `<table style="margin-top:6px"><tr><th>기능별</th><th>호출</th><th>비용</th></tr>${Object.entries(llm.byKind).map(([k, v]) => `<tr><td>${kindKo[k] || k}</td><td>${v.calls}</td><td>${usd(v.cost)}</td></tr>`).join('')}</table>`
      + `<h3>이용 현황</h3><div class="grid"><div class="box"><div class="muted">분석 매장</div><div class="big">${d.stores}</div></div><div class="box"><div class="muted">쿠폰 있음</div><div class="big">${d.withCoupon}</div></div><div class="box"><div class="muted">알림받기 쿠폰</div><div class="big">${d.withNotification}</div></div></div>`
      + `<h3>일별 이용</h3><p class="muted">방문자 = 하루 안 서로 다른 접속(IP 기준, 같은 사람이 와이파이·LTE 바꾸면 2로 셈)</p><table><tr><th>날짜</th><th>방문자</th><th>페이지 열람</th><th>검사 요청</th><th>새 매장</th><th>캐시 재조회</th><th>실패</th></tr>${dayRows.map(([day, v]) => `<tr><td>${day}</td><td>${v.visitors}</td><td>${v.views}</td><td>${v.checks}</td><td>${v.fresh}</td><td>${v.cache}</td><td>${Object.entries(v.fallback || {}).map(([k, n]) => `${k} ${n}`).join(', ') || '-'}</td></tr>`).join('')}</table>`
      + `<h3>최근 분석 매장</h3><table><tr><th>시각</th><th>매장</th><th>지역·업종</th><th>점수</th><th>리뷰</th><th>쿠폰</th></tr>${recent.map((r) => `<tr><td>${hhmm(r.ts)}</td><td>${String(r.name || '').replace(/[<>&]/g, '')}</td><td class="muted">${r.district || ''} ${String(r.category || '').replace(/[<>&]/g, '')}</td><td>${r.score ?? '-'}</td><td>${r.reviews ?? '-'}</td><td>${r.coupons}${r.notify ? ' (알림)' : ''}</td></tr>`).join('')}</table>`
      + `<h3>업종별</h3><table><tr><th>업종</th><th>매장</th><th>쿠폰 있음</th></tr>${cats.map(([c, v]) => `<tr><td>${c}</td><td>${v.stores}</td><td>${v.withCoupon}</td></tr>`).join('')}</table>`
      + `<h3>쿠폰 종류별(매장 수)</h3><table>${kinds.map(([k, n]) => `<tr><td>${k}</td><td>${n}</td></tr>`).join('')}</table>`
      + `<h3>자주 쓰는 쿠폰 이름</h3><table>${(d.topTitles || []).slice(0, 15).map((t) => `<tr><td>${t.title.replace(/[<>&]/g, '')}</td><td>${t.n}</td></tr>`).join('')}</table>`
      + `<p class="muted">기록 ${d.records}줄 · 멤버십 연결 ${d.withMembership}곳</p>`;
  } catch (e) { out.innerHTML = '<p>불러오지 못했어요: ' + String(e.message) + '</p>'; }
})();
</script>
</body></html>
